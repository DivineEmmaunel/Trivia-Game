
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Test your mathematical knowledge with our interactive math trivia game.">
    <title>Math Trivia Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <!-- Landing Page -->
        <section id="landing-page" class="screen">
            <div class="icon">🧮</div>
            <h1>Math Trivia</h1>
            <p>Challenge yourself and test your mathematical skills!</p>

            <form id="nameForm">
                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
                    maxlength="30"
                    required
                >
                <button type="submit">Get Started</button>
            </form>
        </section>

        <!-- Greeting Section -->
        <section id="greeting" class="screen hidden">
            <div class="icon">👋</div>
            <h2 id="greetingText"></h2>
            <p>Are you ready to test your knowledge?</p>
            <button id="startButton" type="button">Start Quiz</button>
        </section>

        <!-- Quiz Section -->
        <section id="quizSection" class="screen hidden">

            <div class="quiz-header">
                <span id="questionCounter"></span>
                <span id="scoreDisplay">Score: 0</span>
            </div>

            <div class="progress-track">
                <div id="progressBar"></div>
            </div>

            <h2 id="questionText"></h2>

            <div id="optionList" class="options"></div>

            <p id="feedback" aria-live="polite"></p>

            <button id="nextButton" type="button" disabled>
                Check Answer
            </button>

        </section>

        <!-- Result Section -->
        <section id="resultSection" class="screen hidden">
            <div class="icon">🏆</div>
            <h1>Quiz Completed!</h1>

            <h2 id="finalGreeting"></h2>
            <p id="finalScore"></p>
            <p id="percentage"></p>
            <p id="resultMessage"></p>

            <button id="restartButton" type="button">
                Play Again
            </button>
        </section>

    </main>

    <script src="trivia.js"></script>
</body>
</html>
